[project]
name = "cfd-interpretability"
version = "0.1.0"
description = "Resumable, Colab-first CFD interpretability pipeline: train MeshGraphNet, extract embeddings, train an SAE, analyze."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tfrecord>=1.14.6",
    "torch>=2.11.0",
    "torch-geometric>=2.7.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "google-colab-cli>=0.0.14",
    "ipywidgets>=8.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*" = ["E402"]
"scripts/_gen_notebook.py" = ["E501"]
